# Operator-supplied example. Never trust a target repository config to relax safety.
[scan]
profile = "standard"
offline = true

[discovery]
respect_gitignore = false # .env may require scanning even if version-control ignored
max_file_size_bytes = 4194304
max_file_count = 100000
max_directory_depth = 64
max_directories = 50000
max_entries = 200000
max_total_bytes_inspected = 134217728
max_sniff_bytes = 8192
max_single_text_read = 8192
max_line_length = 8192
max_elapsed_seconds = 300
follow_symlinks = false
follow_reparse_points = false
include = []
default_exclude = [".git/", "node_modules/", ".venv/", "venv/", "dist/", "build/", "coverage/", "__pycache__/", ".cache/"]
exclude = [] # security-scan specific ignores; independent of .gitignore

[secrets]
enabled = true
max_file_bytes = 1048576
max_total_bytes = 67108864
max_line_bytes = 16384
max_matches_per_rule_per_file = 100
max_findings_per_file = 100
max_findings_total = 1000
max_elapsed_seconds = 300
enable_entropy = true
enable_generic_assignment = true

[sast]
enabled = true
max_file_bytes = 524288
max_total_bytes = 33554432
max_ast_nodes = 10000
max_ast_depth = 100
max_function_nodes = 5000
max_findings_per_file = 100
max_findings_total = 1000
max_seconds = 300

[behavior]
enabled = true
max_file_bytes = 524288
max_total_bytes = 33554432
max_line_bytes = 8192
max_ast_nodes = 10000
max_ast_depth = 100
max_matches_per_file = 100
max_findings_total = 1000
max_seconds = 300

[dependencies]
enabled = true
max_file_bytes = 2097152
max_total_bytes = 33554432
max_entries = 20000
max_dependencies = 20000
max_include_depth = 8
max_seconds = 300

[vulnerability]
enabled = true # still offline unless the trusted scan session explicitly sets offline=false
provider = "osv"
max_queries = 500
max_batch_size = 50
max_response_bytes = 1048576
timeout_seconds = 10
max_provider_seconds = 120
max_provider_bytes_total = 16777216
max_advisories = 100
cache_enabled = true
cache_ttl_seconds = 86400

[correlation]
enabled = true
max_findings = 10000
max_nodes = 20000
max_edges = 30000
max_attack_paths = 1000
max_seconds = 300
proximity_lines = 5

[ai]
enabled = false # requires a separate trusted opt-in at review time
provider = "gemini"
model = "gemini-3.8-flash"
thinking_level = "medium"
include_source = false
max_reviews = 20
max_requests = 22
max_context_chars = 4000
max_total_context_chars = 40000
max_source_lines = 12
max_source_file_bytes = 65536
max_related_findings = 4
max_trace_steps = 8
max_output_tokens = 2048
max_total_output_tokens = 20000
max_estimated_input_tokens = 20000
max_seconds = 180
timeout_seconds = 20
max_retries = 1
