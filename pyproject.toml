[project]
name = "local-security-auditor"
version = "1.0.1"
description = "Offline-first static security auditor for untrusted local projects"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=2.25.0,<3.0.0"]

[project.scripts]
security-auditor = "security_auditor.cli.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_auditor"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/README.md", "/src/security_auditor"]

[tool.uv]
package = true
